<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Inicial - MiBolsillo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Fondo gris claro y centrado vertical completo */
        body { 
            background-color: #f4f6f9; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        /* Estilo para la tarjeta blanca */
        .setup-card { 
            max-width: 500px; 
            width: 100%;
            padding: 3rem;
            border: none; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            background-color: #ffffff;
        }
        /* Botón verde personalizado */
        .btn-crear { 
            background-color: #198754; 
            color: white;
            border: none; 
            font-weight: bold;
            padding: 12px;
        }
        .btn-crear:hover { 
            background-color: #146c43; 
            color: white;
        }
        /* Ajuste para el logo */
        .logo-img {
            max-width: 100px;
            height: auto;
            margin-top: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="card setup-card">
        
        <div class="text-center mb-2"> <img src="{{ url_for('static', filename='img/loguito.png') }}" alt="Logo MiBolsillo" class="logo-img">
    <h2 class="fw-bold text-dark">¡Bienvenido a MiBolsillo!</h2>
    <p class="text-muted">Configurá tu cuenta de administrador para empezar.</p>
</div>
        <form action="/setup" method="POST">
            
            <div class="mb-3">
                <label for="nombre" class="form-label text-secondary fw-medium">Nombre Completo</label>
                <input type="text" class="form-control form-control-lg" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required style="font-size: 1rem;">
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label text-secondary fw-medium">Correo Electrónico</label>
                <input type="email" class="form-control form-control-lg" id="correo" name="correo" placeholder="nombre@ejemplo.com" required style="font-size: 1rem;">
            </div>

            <div class="mb-3">
                <label for="fecha_nacimiento" class="form-label text-secondary fw-medium">Fecha de Nacimiento</label>
                <input type="date" class="form-control form-control-lg" id="fecha_nacimiento" name="fecha_nacimiento" required style="font-size: 1rem;">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-secondary fw-medium">Contraseña de Acceso</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Mínimo 6 caracteres" required style="font-size: 1rem;">
                <div class="form-text text-muted" style="font-size: 0.85rem;">Esta clave será necesaria cada vez que abras la app.</div>
            </div>

            <button type="submit" class="btn btn-crear btn-lg w-100 text-uppercase">CREAR MI CUENTA</button>
        </form>

        <div class="mt-5 text-center border-top pt-3">
            <small class="text-muted">Desarrollado por TutuCode - 2026</small>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
