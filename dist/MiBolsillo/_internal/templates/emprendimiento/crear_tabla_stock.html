{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 40px auto; text-align: center;">
    <h2><i class="fas fa-tools"></i> Configurar Stock</h2>
    <p>Parece que <strong>{{ nombre }}</strong> todavía no tiene una tabla de inventario. Ponle un nombre para generarla.</p>
    
    <form method="post" style="margin-top: 20px;">
        <input type="text" name="tabla" placeholder="Ej: stock_mesas" required style="margin-bottom: 20px;">
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button type="submit" class="btn btn-blue">Generar Inventario</button>
            <a href="/emprendimiento/resumen/{{ eid }}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
