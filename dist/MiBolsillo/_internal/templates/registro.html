{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 50px auto;">
    <h2 style="text-align: center;"><i class="fas fa-user-plus"></i> Crear Cuenta</h2>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div style="background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Nombre Completo:</label>
            <input type="text" name="nombre_completo" required class="form-control" placeholder="Ej: Maikol Pirez">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Correo Electrónico:</label>
            <input type="email" name="correo" required class="form-control" placeholder="tu@correo.com">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Fecha de Nacimiento (DD/MM/YYYY):</label>
            <input type="text" name="fecha_nacimiento" required class="form-control" 
                   pattern="\d{2}/\d{2}/\d{4}" title="Debe tener el formato DD/MM/YYYY" placeholder="Ej: 15/08/1998">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label>Contraseña:</label>
            <input type="password" name="password" required class="form-control" placeholder="******">
        </div>
        
        <button type="submit" class="btn btn-blue" style="width: 100%;">Registrarme</button>
    </form>
    
    <div style="text-align: center; margin-top: 15px;">
        <small>¿Ya tenés cuenta? <a href="{{ url_for('auth.login') }}">Iniciá sesión acá</a></small>
    </div>
</div>
{% endblock %}
