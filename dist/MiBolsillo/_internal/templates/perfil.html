{% extends "base.html" %}
{% block content %}
<div style="max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h2 style="text-align: center; color: #1e293b;"><i class="fas fa-user-cog"></i> Editar Mi Perfil</h2>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="padding: 10px; margin-bottom: 20px; border-radius: 8px; text-align: center; 
                      background-color: {{ '#dcfce7' if category == 'success' else '#fee2e2' }}; 
                      color: {{ '#166534' if category == 'success' else '#991b1b' }};">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <div style="margin-bottom: 20px;">
            <label style="color: #64748b; font-size: 0.9rem; display: block; margin-bottom: 5px;">Nombre Completo</label>
            <input type="text" name="nombre_completo" value="{{ user['nombre_completo'] }}" 
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;" required>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="color: #64748b; font-size: 0.9rem; display: block; margin-bottom: 5px;">Correo Electrónico (No editable)</label>
            <input type="email" value="{{ user['correo'] }}" 
                   style="width: 100%; padding: 10px; border: 1px solid #eee; border-radius: 8px; font-size: 1rem; background: #f8fafc; color: #94a3b8;" readonly>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="color: #64748b; font-size: 0.9rem; display: block; margin-bottom: 5px;">Fecha de Nacimiento</label>
            <input type="date" name="fecha_nacimiento" value="{{ user['fecha_nacimiento'] }}" 
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="color: #64748b; font-size: 0.9rem; display: block; margin-bottom: 5px;">Nueva Contraseña</label>
            <input type="password" name="password" placeholder="Dejá en blanco si no querés cambiarla" 
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;">
        </div>

        <div style="text-align: center; margin-top: 30px; display: flex; gap: 10px; justify-content: center;">
            <button type="submit" style="background: #22c55e; color: white; padding: 10px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold;">
                <i class="fas fa-save"></i> Guardar Cambios
            </button>
            <a href="{{ url_for('home.index') }}" class="btn" style="background: #64748b; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px;">Volver</a>
        </div>
    </form>
</div>
{% endblock %}
