{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 20px auto; padding: 25px; border-radius: 16px;">
   <h2 style="margin-bottom: 25px; color: var(--pocket-blue) !important; display: flex; align-items: center; gap: 10px; font-family: 'Poppins', sans-serif; font-weight: 700;">
    <i class="fas fa-file-invoice-dollar" style="color: var(--money-green);"></i> 
    Nueva Deuda
</h2>
    
    <form method="post">
        <div style="margin-bottom: 18px;">
            <label style="display: block; margin-bottom: 8px; color:var(--pocket-blue); font-weight: 700; font-size: 0.85rem; text-transform: uppercase;">¿Quién debe?</label>
            <input type="text" name="deudor" placeholder="Ej: YO, o nombre del amigo" required 
                   style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #f8fafc; font-size: 1rem;">
        </div>

        <div style="margin-bottom: 18px;">
            <label style="display: block; margin-bottom: 8px; color:var(--pocket-blue); font-weight: 700; font-size: 0.85rem; text-transform: uppercase;">¿A quién le debe?</label>
            <input type="text" name="acreedor" placeholder="Ej: YO, o nombre del acreedor" required 
                   style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #f8fafc; font-size: 1rem;">
        </div>

        <div style="margin-bottom: 18px;">
            <label style="display: block; margin-bottom: 8px; color:var(--pocket-blue); font-weight: 700; font-size: 0.85rem; text-transform: uppercase;">Monto ($):</label>
            <input type="number" name="monto" step="0.01" placeholder="0.00" required 
                   style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #f8fafc; font-size: 1.1rem; font-weight: 700; color: var(--danger);">
        </div>

        <div style="margin-bottom: 18px;">
            <label style="display: block; margin-bottom: 8px; color:var(--pocket-blue); font-weight: 700; font-size: 0.85rem; text-transform: uppercase;">Motivo:</label>
            <input type="text" name="motivo" placeholder="Ej: Asado, Préstamo..." 
                   style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #f8fafc; font-size: 1rem;">
        </div>

        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; color:var(--pocket-blue); font-weight: 700; font-size: 0.85rem; text-transform: uppercase;">
                <i class="far fa-calendar-alt" style="margin-right: 5px; color: var(--pocket-green);"></i> Fecha
            </label>
            <input type="date" name="fecha" required 
                   class="input-date-pro"
                   style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #f8fafc; font-size: 1rem; font-family: inherit; color: #1e293b;">
        </div>

        <button type="submit" class="btn btn-blue" style="width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);">
            <i class="fas fa-save" style="margin-right: 8px;"></i> Guardar Deuda
        </button>
    </form>
</div>

<style>
    .input-date-pro:focus {
        border-color: var(--pocket-blue) !important;
        background-color: #ffffff !important;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        outline: none;
    }
    
    /* Estilo para el icono del calendario en Chrome/Android */
    .input-date-pro::-webkit-calendar-picker-indicator {
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="15" viewBox="0 0 24 24" fill="none" stroke="%232563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>');
        cursor: pointer;
    }
</style>
{% endblock %}
