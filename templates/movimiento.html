{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
<h2 style="margin-bottom: 25px; color: var(--money-green) !important; display: flex; align-items: center; gap: 10px; font-family: 'Poppins', sans-serif; font-weight: 700;">
    <i class="fas fa-exchange-alt" style="color: var(--pocket-green);"></i> 
    Registrar Movimiento
</h2>    
    <form method="post">
        <div style="margin-bottom: 15px;">
    <label style="display: block; margin-bottom: 8px; color: var(--pocket-blue); font-weight: 700; font-family: 'Poppins', sans-serif;">
        Tipo de Movimiento:
    </label>
    
    <select name="tipo" id="tipo" required onchange="toggleDestino()" 
            style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid var(--border); font-weight: 600; color: var(--text); cursor: pointer;">
        
        <option value="Ingreso" style="color: var(--money-green); font-weight: 700;">
            ↑ Ingreso
        </option>
        
        <option value="Egreso" style="color: var(--danger); font-weight: 700;">
            ↓ Egreso
        </option>
        
        <option value="Transferencia" style="color: var(--pocket-blue); font-weight: 700;">
            ⇄ Transferencia
        </option>
        
    </select>
</div>
      
        <div style="margin-bottom: 15px;">
    <label style="display: block; margin-bottom: 8px; color: var(--pocket-blue); font-weight: 700; font-family: 'Poppins', sans-serif;">
        Monto ($):
    </label>
    
    <input type="number" name="monto" step="0.01" required placeholder="0.00"
           style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid var(--border); font-size: 1rem; color: var(--text); outline: none; transition: border-color 0.2s;"
           onfocus="this.style.borderColor='var(--pocket-blue)'" 
           onblur="this.style.borderColor='var(--border)'">
</div>

        <div style="margin-bottom: 15px;">
    <label style="display: block; margin-bottom: 8px; color: var(--pocket-blue); font-weight: 700; font-family: 'Poppins', sans-serif;">
        Cuenta Origen:
    </label>
    
    <select name="cuenta_origen" required 
            style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid var(--border); font-size: 1rem; color: var(--text); background-color: white; cursor: pointer; outline: none;"
            onfocus="this.style.borderColor='var(--pocket-blue)'" 
            onblur="this.style.borderColor='var(--border)'">
        
        {% for c in cuentas %}
            <option value="{{c.nombre}}">{{c.nombre}}</option>
        {% endfor %}
        
    </select>
</div>

        <div id="div_destino" style="margin-bottom: 15px; display: none;">
    <label style="display: block; margin-bottom: 8px; color: var(--pocket-blue); font-weight: 700; font-family: 'Poppins', sans-serif;">
        Cuenta Destino:
    </label>
    
    <select name="cuenta_destino" 
            style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid var(--border); font-size: 1rem; color: var(--text); background-color: white; cursor: pointer; outline: none;"
            onfocus="this.style.borderColor='var(--pocket-blue)'" 
            onblur="this.style.borderColor='var(--border)'">
        
        <option value="">-- Seleccionar destino --</option>
        {% for c in cuentas %}
            <option value="{{c.nombre}}">{{c.nombre}}</option>
        {% endfor %}
        
    </select>
</div>

       <div style="margin-bottom: 15px;">
    <label style="display: block; margin-bottom: 8px; color: var(--pocket-blue); font-weight: 700; font-family: 'Poppins', sans-serif;">
        Motivo / Detalle:
    </label>
    
    <input type="text" name="motivo" placeholder="Ej: Compra de materiales, Venta..."
           style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid var(--border); font-size: 1rem; color: var(--text); outline: none; transition: border-color 0.2s;"
           onfocus="this.style.borderColor='var(--pocket-blue)'" 
           onblur="this.style.borderColor='var(--border)'">
</div>

        <div style="margin-bottom: 20px;">
    <label style="display: block; margin-bottom: 8px; color: var(--money-green); font-weight: 700; font-family: 'Poppins', sans-serif; font-size: 0.9rem; text-transform: uppercase;">
        <i class="fas fa-calendar-alt" style="color: var(--pocket-blue); margin-right: 8px;"></i>Fecha de Movimiento
    </label>
    <input type="date" name="fecha" required 
           class="form-control"
           style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; font-family: inherit; font-size: 1rem; color: #1e293b; background-color: #f8fafc; outline: none; transition: all 0.3s ease;">
</div>

        <button type="submit" class="btn btn-blue" style="width: 100%; font-size: 1.1em;">
            <i class="fas fa-save"></i> Guardar Movimiento
        </button>
    </form>
</div>
<style>
    /* Efecto Pro al seleccionar el calendario */
    .input-calendario-pro:focus {
        border-color: #2563eb !important;
        background-color: #ffffff !important;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    /* Estilo para el icono del calendario en Chrome/Android */
    .input-calendario-pro::-webkit-calendar-picker-indicator {
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="15" viewBox="0 0 24 24" fill="none" stroke="%232563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>');
        cursor: pointer;
        padding: 5px;
    }
</style>
<script>
function toggleDestino() {
    var tipo = document.getElementById("tipo").value;
    var divDestino = document.getElementById("div_destino");
    if (tipo === "Transferencia") {
        divDestino.style.display = "block";
    } else {
        divDestino.style.display = "none";
    }
}
</script>
{% endblock %}
