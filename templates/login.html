{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 50px auto;">
    <h2 style="text-align: center;"><i class="fas fa-sign-in-alt"></i> Entrar al Sistema</h2>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div style="background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Correo Electrónico:</label>
            <input type="email" name="correo" required class="form-control" placeholder="tu@correo.com">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label>Contraseña:</label>
            <input type="password" name="password" required class="form-control" placeholder="******">
        </div>
        
        <button type="submit" class="btn btn-blue" style="width: 100%; background: #10b981;">Ingresar</button>
    </form>
    
    <div style="text-align: center; margin-top: 15px;">
        <small>¿No tenés cuenta todavía? <a href="{{ url_for('auth.registro') }}">Registrate acá</a></small>
    </div>
</div>
{% endblock %}
