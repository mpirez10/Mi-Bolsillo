<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/loguito.ico') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Bolsillo | Gestión de Finanzas y Negocios</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    :root { 
        /* Colores inspirados en tu logo */
        --pocket-blue: #1e40af;       /* Azul institucional */
        --pocket-blue-light: #eff6ff;
        --money-green: #10b981;      /* Verde éxito/ingreso */
        --money-green-dark: #059669;
        
        --primary: var(--pocket-blue); 
        --accent: var(--money-green); 
        --bg: #f8fafc;               /* Un gris más sutil y limpio */
        --text: #1e293b; 
        --card-bg: #ffffff; 
        --border: #e2e8f0; 
        --danger: #ef4444; 
    }
    
    body { 
        font-family: 'Inter', sans-serif; 
        margin: 0; 
        padding: 15px; 
        background-color: var(--bg); 
        color: var(--text); 
        line-height: 1.5;
        padding-bottom: 90px; /* Espacio extra para el tab bar mobile */
    }

    .container { max-width: 1050px; margin: 0 auto; }
    
    /* Barra de navegación pro */
    .nav-bar { 
        background: white; 
        padding: 12px 24px; 
        border-radius: 16px; 
        margin-bottom: 25px; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); 
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        border: 1px solid var(--border);
    }

    .brand { display: flex; align-items: center; text-decoration: none; gap: 12px; }
    .brand-logo-img { height: 40px; width: auto; transition: transform 0.3s ease; }
    .brand:hover .brand-logo-img { transform: scale(1.05); }
    
    .brand-text { font-family: 'Poppins', sans-serif; line-height: 1; }
    .text-mi { color: var(--money-green); font-weight: 800; font-size: 1.3rem; letter-spacing: -0.5px; }
    .text-bolsillo { color: var(--pocket-blue); font-weight: 800; font-size: 1.3rem; letter-spacing: -0.5px; }
    .brand-subtext { 
        display: block; 
        font-size: 0.6rem; 
        color: #94a3b8; 
        font-weight: 700; 
        text-transform: uppercase; 
        letter-spacing: 1.2px;
        margin-top: 2px;
    }

    .nav-links { display: flex; gap: 12px; align-items: center; }

    /* Botones mejorados */
    .btn { 
        padding: 10px 18px; 
        border-radius: 10px; 
        text-decoration: none; 
        font-weight: 600; 
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        border: none; 
        cursor: pointer; 
        display: inline-flex; 
        align-items: center; 
        gap: 8px; 
        font-size: 0.9rem; 
    }
    .btn-blue { 
        background: var(--pocket-blue); 
        color: white; 
        box-shadow: 0 4px 6px -1px rgba(30, 64, 175, 0.2);
    }
    .btn-blue:hover { background: #1e3a8a; transform: translateY(-1px); }
    
    .btn-green { 
        background: var(--money-green); 
        color: white; 
        box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
    }
    .btn-green:hover { background: var(--money-green-dark); transform: translateY(-1px); }

    .btn-outline { 
        border: 1px solid var(--border); 
        color: #475569; 
        background: white; 
    }
    .btn-outline:hover { background: #f1f5f9; color: var(--pocket-blue); border-color: var(--pocket-blue); }
    
    /* Barra Inferior (Premium Feel) */
    .mobile-tab-bar {
        display: none;
        position: fixed;
        bottom: 15px;
        left: 15px;
        right: 15px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        height: 70px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        grid-template-columns: repeat(4, 1fr);
        z-index: 1000;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    .tab-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: #94a3b8;
        font-size: 0.75rem;
        font-weight: 600;
        gap: 4px;
        transition: all 0.3s ease;
    }

    .tab-item i { font-size: 1.3rem; transition: transform 0.2s ease; }
    .tab-item.active { color: var(--pocket-blue); }
    .tab-item.active i { transform: translateY(-2px); color: var(--pocket-blue); }

    /* Menú de usuario */
    .user-btn { 
        background: white; 
        border: 1px solid var(--border); 
        padding: 8px 16px; 
        border-radius: 12px; 
        font-weight: 600;
        transition: all 0.2s;
    }
    .user-btn:hover { border-color: var(--pocket-blue); background: var(--pocket-blue-light); }

    /* Ajustes Responsive */
    @media (max-width: 768px) {
        body { padding: 10px; padding-bottom: 100px; }
        .nav-links { display: none; }
        .nav-bar { margin-bottom: 20px; border-radius: 12px; }
        .mobile-tab-bar { display: grid; }
    }
</style>
</head>
<body>
    <div class="container">
        <header class="nav-bar">
            <a href="/" class="brand">
                <img src="{{ url_for('static', filename='img/loguito.png') }}" alt="Logo Mi Bolsillo" class="brand-logo-img">
                <div class="brand-text">
                    <div><span class="text-mi">Mi</span><span class="text-bolsillo">Bolsillo</span></div>
                    <span class="brand-subtext">Finanzas y Negocios</span>
                </div>
            </a>

            <nav class="nav-links">
                <a href="/" class="btn btn-outline"><i class="fas fa-home"></i> Inicio</a>
                <a href="/deudas" class="btn btn-outline"><i class="fas fa-file-invoice-dollar"></i> Deudas</a>
                <a href="/emprendimiento" class="btn btn-blue"><i class="fas fa-chart-line"></i> Mi Negocio</a>
                
                {% if current_user.is_authenticated %}
                <div class="user-menu-container">
                    <button class="user-btn" onclick="toggleMenu(event)">
                        <span>{{ current_user.nombre_completo.split(' ')[0] }}</span> <i class="fas fa-chevron-down" style="font-size: 0.7rem;"></i>
                    </button>
                    <div id="dropdownMenu" class="dropdown-menu">
                        <a href="{{ url_for('auth.perfil') }}"><i class="fas fa-user-circle me-2"></i> Mi Perfil</a>
                        <a href="{{ url_for('descargar_respaldo') }}"><i class="fas fa-cloud-download-alt me-2"></i> Respaldar Datos</a>
                        <div class="dropdown-divider"></div>
                        <a href="{{ url_for('auth.logout') }}" style="color: var(--danger);">
                            <i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión
                        </a>
                    </div>
                </div>
                {% else %}
                <a href="{{ url_for('auth.login') }}" class="btn btn-blue">Entrar</a>
                {% endif %}
            </nav>
        </header>
        
        <main>
            {% block content %}{% endblock %}
        </main>

        <nav class="mobile-tab-bar">
            <a href="/" class="tab-item {% if request.path == '/' %}active{% endif %}">
                <i class="fas fa-wallet"></i>
                <span>Cuentas</span>
            </a>
            <a href="/deudas" class="tab-item {% if request.path == '/deudas' %}active{% endif %}">
                <i class="fas fa-hand-holding-usd"></i>
                <span>Deudas</span>
            </a>
            <a href="/emprendimiento" class="tab-item {% if request.path.startswith('/emprendimiento') %}active{% endif %}">
                <i class="fas fa-store"></i>
                <span>Negocio</span>
            </a>
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('auth.perfil') }}" class="tab-item {% if '/perfil' in request.path %}active{% endif %}">
                <i class="fas fa-user"></i>
                <span>Perfil</span>
            </a>
            {% else %}
            <a href="{{ url_for('auth.login') }}" class="tab-item">
                <i class="fas fa-sign-in-alt"></i>
                <span>Login</span>
            </a>
            {% endif %}
        </nav>
    </div>

    <script>
        function toggleMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById("dropdownMenu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }
        window.onclick = function(event) {
            const menu = document.getElementById("dropdownMenu");
            if (menu && !event.target.closest('.user-menu-container')) {
                menu.style.display = "none";
            }
        }
    </script>
</body>
</html>
