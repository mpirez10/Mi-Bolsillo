<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Barbería - MiBolsillo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .bg-orange { background-color: #fd7e14 !important; color: white; }
        .btn-orange { background-color: #fd7e14; color: white; border: none; }
        .btn-orange:hover { background-color: #e36a07; color: white; }
        .accordion-button:not(.collapsed) { background-color: #e7f1ff; color: #0c63e4; }
        .card-turno { border-left: 5px solid #ffc107; transition: 0.3s; }
        .estado-pago { border-left-color: #198754; }
        .estado-falto { border-left-color: #dc3545; }
        .estado-nopago { border-left-color: #fd7e14; }
        .acciones-chicas button { font-size: 0.8rem; padding: 2px 5px; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>💈 Agenda Barbería</h2>
        <a href="/" class="btn btn-outline-secondary btn-sm">Volver</a>
    </div>

    <button class="btn btn-dark w-100 mb-4" data-bs-toggle="modal" data-bs-target="#modalDia">
        🗓️ AGREGAR AGENDA (Día)
    </button>

    <div class="accordion" id="accordionAgenda">
        {% for agenda in agendas %}
        <div class="accordion-item shadow-sm mb-2">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ agenda.id }}">
                    <strong>{{ agenda.fecha.strftime('%d/%m/%Y') }}</strong>
                </button>
            </h2>
            <div id="collapse{{ agenda.id }}" class="accordion-collapse collapse" data-bs-parent="#accordionAgenda">
                <div class="accordion-body">
                    
                    <button class="btn btn-primary btn-sm mb-3" onclick="prepararTurno({{ agenda.id }})">
                        + AGREGAR TURNO
                    </button>

                    <div class="list-group">
                        {% for turno in agenda.turnos %}
                        <div class="list-group-item card-turno 
                            {{ 'estado-pago' if turno.estado == 'Pago' }}
                            {{ 'estado-falto' if turno.estado == 'Faltó' }}
                            {{ 'estado-nopago' if turno.estado == 'No Pago' }}">
                            
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <span class="badge bg-dark">{{ turno.hora.strftime('%H:%M') }}</span>
                                    <span class="h6 mb-0 ms-1">{{ turno.cliente }}</span>
                                    
                                    <span class="acciones-chicas ms-2">
                                        <button class="btn btn-link text-decoration-none p-0" onclick="editarTurno('{{ turno.id }}', '{{ turno.cliente }}', '{{ turno.monto }}', '{{ turno.detalle }}')">✏️</button>
                                        <button class="btn btn-link text-danger text-decoration-none p-0" onclick="borrarTurno({{ turno.id }})">🗑️</button>
                                    </span>

                                    <p class="mb-1 text-muted small">{{ turno.detalle }}</p>
                                    <strong class="text-primary">${{ turno.monto }}</strong>
                                </div>
                                
                                <span class="badge 
                                    {{ 'bg-warning' if turno.estado == 'Pendiente' }}
                                    {{ 'bg-success' if turno.estado == 'Pago' }}
                                    {{ 'bg-danger' if turno.estado == 'Faltó' }}
                                    {{ 'bg-orange' if turno.estado == 'No Pago' }}">
                                    {{ turno.estado }}
                                </span>
                            </div>

                            <div class="mt-3 d-flex gap-2">
                                <button class="btn btn-sm btn-success flex-grow-1" onclick="cambiarEstado({{ turno.id }}, 'Pago')">Pago</button>
                                <button class="btn btn-sm btn-danger flex-grow-1" onclick="cambiarEstado({{ turno.id }}, 'Faltó')">Faltó</button>
                                <button class="btn btn-sm btn-orange flex-grow-1" onclick="cambiarEstado({{ turno.id }}, 'No Pago')">No Pago</button>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<div class="modal fade" id="modalDia" tabindex="-1">
    <div class="modal-dialog">
        <form action="/agregar_dia" method="POST" class="modal-content">
            <div class="modal-header"><h5>Nuevo Día de Agenda</h5></div>
            <div class="modal-body">
                <label>Seleccionar Fecha (DD/MM/YYYY):</label>
                <input type="date" name="fecha" class="form-control" required>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Crear Día</button>
            </div>
        </form>
    </div>
</div>

<div class="modal fade" id="modalTurno" tabindex="-1">
    <div class="modal-dialog">
        <form id="formTurno" action="/guardar_turno" method="POST" class="modal-content">
            <div class="modal-header"><h5 id="tituloModal">Nuevo Turno</h5></div>
            <div class="modal-body">
                <input type="hidden" name="agenda_id" id="agenda_id_input">
                <input type="hidden" name="turno_id" id="turno_id_input">
                
                <div class="mb-3">
                    <label>Hora:</label>
                    <input type="time" name="hora" id="edit_hora" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Cliente:</label>
                    <input type="text" name="cliente" id="edit_cliente" class="form-control" placeholder="Nombre del cliente" required>
                </div>
                <div class="mb-3">
                    <label>Detalle (Servicios):</label>
                    <input type="text" name="detalle" id="edit_detalle" class="form-control" placeholder="Corte, Barba, etc.">
                </div>
                <div class="mb-3">
                    <label>Monto ($):</label>
                    <input type="number" name="monto" id="edit_monto" class="form-control" placeholder="0.00">
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-success">Guardar Turno</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Función para abrir el modal de nuevo turno
    function prepararTurno(agendaId) {
        document.getElementById('formTurno').reset();
        document.getElementById('agenda_id_input').value = agendaId;
        document.getElementById('turno_id_input').value = "";
        document.getElementById('tituloModal').innerText = "Nuevo Turno";
        new bootstrap.Modal(document.getElementById('modalTurno')).show();
    }

    // Función para editar (Carga los datos en el modal)
    function editarTurno(id, cliente, monto, detalle) {
        document.getElementById('turno_id_input').value = id;
        document.getElementById('edit_cliente').value = cliente;
        document.getElementById('edit_monto').value = monto;
        document.getElementById('edit_detalle').value = detalle;
        document.getElementById('tituloModal').innerText = "Editar Turno";
        new bootstrap.Modal(document.getElementById('modalTurno')).show();
    }

    // Borrar con AJAX
    function borrarTurno(id) {
        if(confirm('¿Tas seguro de borrar este turno, bo?')) {
            fetch(`/borrar_turno/${id}`, { method: 'POST' })
            .then(() => location.reload());
        }
    }

    // Cambiar estado con AJAX (Pago, Faltó, etc)
    function cambiarEstado(id, nuevoEstado) {
        fetch(`/actualizar_estado/${id}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ estado: nuevoEstado })
        }).then(() => location.reload());
    }
</script>

</body>
</html>
