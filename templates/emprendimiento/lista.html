{% extends "base.html" %}
{% block content %}
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2><i class="fas fa-rocket"></i> Mis Emprendimientos</h2>
        <a href="/emprendimiento/crear" class="btn btn-blue"><i class="fas fa-plus"></i> Crear Nuevo</a>
    </div>
    
    <div style="display: grid; gap: 15px;">
        {% for e in emprendimientos %}
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: white;">
            <strong style="font-size: 1.1em;">{{ e.nombre }}</strong>
            <div style="display: flex; gap: 10px;">
                <a href="/emprendimiento/resumen/{{ e.id }}" class="btn btn-blue">Ingresar</a>
                <a href="/emprendimiento/eliminar/{{ e.id }}" class="btn" style="color: var(--danger);" onclick="return confirm('¿Borrar todo?')">
                    <i class="fas fa-trash"></i>
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
