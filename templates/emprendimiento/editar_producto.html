<form method="POST">
    <input name="nombre" value="{{ producto.nombre }}" required>

    <input name="detalle" value="{{ producto.detalle }}">
    <input name="talle" value="{{ producto.talle }}">

    <input name="precio" type="number" step="0.01" value="{{ producto.precio }}">
    <input name="stock" type="number" value="{{ producto.stock }}">

    <button type="submit">Guardar cambios</button>
</form>
