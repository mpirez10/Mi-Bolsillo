<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto | Mi Bolsillo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 20px;
            color: #1f2937;
        }

        .grupo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .fila {
            display: flex;
            gap: 10px;
        }

        .fila .grupo {
            flex: 1;
        }

        .acciones {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-guardar {
            background-color: #2563eb;
            color: white;
        }

        .btn-guardar:hover {
            background-color: #1d4ed8;
        }

        .btn-cancelar {
            background-color: #e5e7eb;
        }

        .btn-cancelar:hover {
            background-color: #d1d5db;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
        }

    </style>
</head>

<body>

<div class="container">
    <h2>✏️ Editar Producto</h2>

    <form method="POST" id="formProducto">

        <div class="grupo">
            <label>Nombre</label>
            <input name="nombre" value="{{ producto.nombre }}" required>
        </div>

        <div class="grupo">
            <label>Detalle</label>
            <input name="detalle" value="{{ producto.detalle }}">
        </div>

        <div class="grupo">
            <label>Talle</label>
            <input name="talle" value="{{ producto.talle }}">
        </div>

        <div class="fila">
            <div class="grupo">
                <label>Precio ($)</label>
                <input name="precio" type="number" step="0.01" value="{{ producto.precio }}" required>
            </div>

            <div class="grupo">
                <label>Stock</label>
                <input name="stock" type="number" value="{{ producto.stock }}" required>
            </div>
        </div>

        <div class="acciones">
            <a href="{{ url_for('emprendimiento.stock', eid=eid) }}">
                <button type="button" class="btn btn-cancelar">Cancelar</button>
            </a>

            <button type="submit" class="btn btn-guardar">Guardar cambios</button>
        </div>

    </form>
</div>

<script>
    const form = document.getElementById("formProducto");

    form.addEventListener("submit", function(e) {
        const precio = parseFloat(form.precio.value);
        const stock = parseInt(form.stock.value);

        if (precio < 0 || isNaN(precio)) {
            alert("Precio inválido");
            e.preventDefault();
        }

        if (stock < 0 || isNaN(stock)) {
            alert("Stock inválido");
            e.preventDefault();
        }
    });
</script>

</body>
</html>
